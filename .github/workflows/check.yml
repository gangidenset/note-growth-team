# push / プルリクエストのたびに npm run check（型チェック・テスト・秘密情報スキャン・データ整合性）を実行する。
# オーナーの Windows 環境でも動くことを確認するため、Ubuntu と Windows の両方で動かす。
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: npm run check
        run: npm run check
